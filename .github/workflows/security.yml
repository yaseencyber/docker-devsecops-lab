name: Docker DevSecOps Security Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  docker-security:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Dockerfile security/linting
      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

      # 3. Secret scanning
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3

      # 4. Build container image
      - name: Build Docker Image
        run: |
          docker build -t docker-devsecops-lab:latest .

      # 5. Trivy vulnerability scanning
      - name: Run Trivy Vulnerability Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: docker-devsecops-lab:latest
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 0
          vuln-type: os,library

      # 6. Generate SBOM using Syft
      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          image: docker-devsecops-lab:latest
          format: cyclonedx-json
          output-file: sbom.cdx.json

      # 7. Scan image with Grype
      - name: Run Grype Vulnerability Scan
        uses: anchore/scan-action@v7
        with:
          image: docker-devsecops-lab:latest
          severity-cutoff: high
          fail-build: false

      # 8. Save SBOM as GitHub artifact
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: docker-sbom
          path: sbom.cdx.json
